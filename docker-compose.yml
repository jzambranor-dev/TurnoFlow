version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnoflow_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/uploads
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - turnoflow_net

  nginx:
    image: nginx:alpine
    container_name: turnoflow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - uploads_data:/var/www/html/uploads:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - turnoflow_net

  postgres:
    image: postgres:15-alpine
    container_name: turnoflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-turnoflow}
      POSTGRES_USER: ${DB_USER:-turnoflow}
      POSTGRES_PASSWORD: ${DB_PASS:-turnoflow123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-turnoflow} -d ${DB_NAME:-turnoflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - turnoflow_net

volumes:
  postgres_data:
  uploads_data:

networks:
  turnoflow_net:
    driver: bridge
